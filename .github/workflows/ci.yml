name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-glx libglib2.0-0 libsm6 libxext6 libxrender-dev libgomp1

      - name: Install CPU PyTorch
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ultralytics opencv-python-headless mediapipe numpy
          pip install pytest flake8

      - name: Download minimal YOLO model for tests
        run: |
          mkdir -p models
          python -c "from ultralytics import YOLO; YOLO('yolo11n.pt')"
          echo "Model downloaded OK"

      - name: Lint
        run: |
          flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics --ignore=F821

      - name: Test
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Verify imports
        run: |
          python -c "from src.device_manager import get_device; from src.fps_counter import FPSCounter; from src.utils import draw_fps; print('Imports OK')"
